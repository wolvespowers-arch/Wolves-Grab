<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wolves Grab - video downloader</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#143530">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@800&family=Public+Sans:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>
  <div class="brand">Wolves Grab</div>
  <h1>Drop the link.<br>Take the video.</h1>
    <p class="sub">Works with TikTok and Instagram. Paste a public link below.</p>
  <div class="box">
    <input id="url" type="url" placeholder="Paste a video link" aria-label="Video link" autocomplete="off">
    <button id="go">Find video</button>
  </div>
  <div id="msg" role="status"></div>
  <section id="result">
    <div class="inner">
      <img id="thumb" alt="">
      <div>
        <p id="title"></p>
        <p id="meta"></p>
        <div class="row">
          <button id="dlv">Download video</button>
          <button id="dla" class="alt">Audio only</button>
        </div>
      </div>
    </div>
  </section>
  <small>Only save videos you own or have permission to use.</small>
</main>
<script src="script.js"></script>
</body>
                                                   </html>
